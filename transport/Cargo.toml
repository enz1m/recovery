[package]
name = "enzimos-recovery-transport"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt", "process", "time", "io-util", "sync", "macros"] }
libc = "0.2"
zeroize = "1"

[dependencies.enzimos-platform]
git = "https://github.com/enz1m/enzimos-packages.git"
rev = "bfbc46409befb5bbd67e766a1175f6b0a94774d7"
[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
