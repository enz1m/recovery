<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Recovery</title>
  <defs>
    <filter id="enz-recovery-drop" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- circle keyline; face r 35 on (64 64); red ring r 40, 12 px, from 10 o'clock clockwise round to 8 o'clock;
       arrowhead base across r 27..53 at 300 deg, tip on the ring at 272 deg -> points counter-clockwise -->
  <g filter="url(#enz-recovery-drop)">
    <circle cx="64" cy="64" r="35" fill="#FFFFFF"/>
    <path d="M29.36 84 A40 40 0 1 0 29.36 44" fill="none" stroke="#E5484D" stroke-width="12" stroke-linecap="round"/>
    <path d="M42.35 51.5 L16.37 36.5 L24.02 65.4 Z" fill="#E5484D" stroke="#E5484D" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <g fill="#B9C3D3">
    <rect x="62" y="34" width="4" height="6" rx="2"/>
    <rect x="88" y="62" width="6" height="4" rx="2"/>
    <rect x="62" y="88" width="4" height="6" rx="2"/>
  </g>
  <rect x="61" y="44" width="6" height="23" rx="3" fill="#2B3140"/>
  <rect x="61" y="61" width="20" height="6" rx="3" fill="#2B3140" transform="rotate(30 64 64)"/>
  <circle cx="64" cy="64" r="4.5" fill="#2B3140"/>
</svg>
